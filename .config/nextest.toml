# A hung test must fail, not stall the run. The whole suite finishes in a
# couple of seconds, so anything still going after 30s is stuck — a deadlock,
# or a poll loop waiting on a real clock. Two periods, then it is killed.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# CI has no terminal to interrupt, so report failures rather than stopping at
# the first one.
[profile.ci]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# A cold Godot import of the committed atlases costs 77 CPU-seconds, measured.
# One at a time, or three of them share a runner's cores and each one's own
# watchdog fires. The longer period is for the same reason.
[[profile.default.overrides]]
filter = 'binary_id(render::e2e)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary_id(render::e2e)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 5 }
