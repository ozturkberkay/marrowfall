[workspace]
resolver = "3"
members = [
    "crates/game",
    "crates/host",
    "crates/render",
    "crates/sprites",
    "crates/worldgen",
    "crates/xtask-art",
    "crates/xtask-world",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
publish = false
# The storefront SDK exception in LICENSE adds permissions on top of this; it
# grants rights rather than removing them, so the SPDX id stays plain GPL.
license = "GPL-3.0-or-later"

[workspace.dependencies]
game = { path = "crates/game" }
host = { path = "crates/host" }
sprites = { path = "crates/sprites" }
worldgen = { path = "crates/worldgen" }

godot = { version = "0.5.5", features = ["api-4-7"] }
hecs = "0.11"
glam = "0.33"
crossbeam-channel = "0.5.15"
triple_buffer = "9.0"

# The sprite manifest format is written by the art pipeline and read by the
# game, so these two also ship inside the GDExtension library.
ron = "0.12"

# Worldgen. `fastnoise-lite` is pinned to `std` only: its `libm` feature swaps in
# a different maths implementation, and the world must not change under us.
fastnoise-lite = { version = "1.1.1", default-features = false, features = ["std"] }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }

# Art pipeline (xtask-art) only.
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
# The rig and mesh gates read the glTF node graph. `import` would pull in image
# decoding, and no gate reads a texture, so the JSON and the GLB container are
# all this needs.
gltf = { version = "1.4.1", default-features = false, features = ["names"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "query",
    "rustls",
    "webpki-roots",
] }
rusty-leveldb = { version = "4.0.1", default-features = false, features = ["fs"] }
serde_json = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "fs"] }
# The skeleton profile: every published rig limit, as data.
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Keep our own code quick to recompile while dependencies (notably the Godot
# bindings) are optimized once and cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
