[workspace]
resolver = "3"
members = ["crates/game", "crates/host", "crates/render", "crates/xtask-art"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
game = { path = "crates/game" }
host = { path = "crates/host" }

godot = { version = "0.5.5", features = ["api-4-7"] }
hecs = "0.11"
glam = "0.33"
crossbeam-channel = "0.5.15"
triple_buffer = "9.0"

# Art pipeline (xtask-art) only.
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "rustls",
    "webpki-roots",
] }
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "fs"] }

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Keep our own code quick to recompile while dependencies (notably the Godot
# bindings) are optimized once and cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
