# Which bone fills each role, per naming convention.
#
# Retargeting matches by role, never by name. A provider is a table here plus
# a `MotionSource` variant, tied together by `MotionSource::bone_convention`.
#
# The two tables are identical, and they are still two tables: a bought rig
# names its bones the same way today and nothing says the next one will.
# `[fingerprints]` is what tells them apart.

canonical = "meshy"

# Roles a source rig is allowed to leave out. Every other role must be in
# every convention, or a clip arrives with nothing to drive that bone. Both
# conventions below fill all 22, so nothing is optional yet.
optional_roles = []

# The two roles whose joints root travel is sized by: a clip authored for a
# longer thigh takes a longer step, and a step is what the femur measures.
# Total height carries the head and the feet, and neither one takes a step.
stride_segment = ["left_upper_leg", "left_leg"]

# The roles that stand on the floor. The retarget lifts every clip until the
# lowest of these over the whole clip stands where this rig's own rest pose
# stands, and `clip.floor_snap` reports what is left under it. Not zero: the
# toe joint here is the ball of the foot and rests 0.0307 m above the sole.
ground_roles = ["left_toe", "right_toe"]

[conventions.meshy]
hips = "Hips"
spine_lower = "Spine"
spine_middle = "Spine1"
spine_upper = "Spine2"
neck = "Neck"
head = "Head"
left_shoulder = "LeftShoulder"
left_arm = "LeftArm"
left_forearm = "LeftForeArm"
left_hand = "LeftHand"
left_upper_leg = "LeftUpLeg"
left_leg = "LeftLeg"
left_foot = "LeftFoot"
left_toe = "LeftToeBase"
right_shoulder = "RightShoulder"
right_arm = "RightArm"
right_forearm = "RightForeArm"
right_hand = "RightHand"
right_upper_leg = "RightUpLeg"
right_leg = "RightLeg"
right_foot = "RightFoot"
right_toe = "RightToeBase"

[conventions.mixamo]
hips = "Hips"
spine_lower = "Spine"
spine_middle = "Spine1"
spine_upper = "Spine2"
neck = "Neck"
head = "Head"
left_shoulder = "LeftShoulder"
left_arm = "LeftArm"
left_forearm = "LeftForeArm"
left_hand = "LeftHand"
left_upper_leg = "LeftUpLeg"
left_leg = "LeftLeg"
left_foot = "LeftFoot"
left_toe = "LeftToeBase"
right_shoulder = "RightShoulder"
right_arm = "RightArm"
right_forearm = "RightForeArm"
right_hand = "RightHand"
right_upper_leg = "RightUpLeg"
right_leg = "RightLeg"
right_foot = "RightFoot"
right_toe = "RightToeBase"

# The retargeting hierarchy, by role. This is not the rig's own bone
# hierarchy, which is `[profile.parents]`: a source with three spine bones
# drives a target with four, so the chain is keyed by role and the transfer
# walks it, stepping over any role a convention leaves out. `hips` is the top
# and has no row.
[retarget_chain]
spine_lower = "hips"
spine_middle = "spine_lower"
spine_upper = "spine_middle"
neck = "spine_upper"
head = "neck"
left_shoulder = "spine_upper"
left_arm = "left_shoulder"
left_forearm = "left_arm"
left_hand = "left_forearm"
left_upper_leg = "hips"
left_leg = "left_upper_leg"
left_foot = "left_leg"
left_toe = "left_foot"
right_shoulder = "spine_upper"
right_arm = "right_shoulder"
right_forearm = "right_arm"
right_hand = "right_forearm"
right_upper_leg = "hips"
right_leg = "right_upper_leg"
right_foot = "right_leg"
right_toe = "right_foot"

# One bone per convention that no other convention has, so two identical role
# tables can still be told apart. Both are measured, not guessed: the
# committed `humanoid.glb` carries `headfront`, and a downloaded Mixamo FBX
# carries `HeadTop_End`. Matched with the namespace and the case stripped, so
# `mixamorig:HeadTop_End` counts.
[fingerprints]
meshy = ["headfront"]
mixamo = ["HeadTop_End"]

# The absolute world direction each role's bone must point in, which is the
# reference pose the retarget aims both rigs to before it measures the offset
# between them. One row per role, torso included: the code this replaces
# corrected only bones with exactly one mapped child, so it silently skipped
# `Hips`, the spine, `Head`, both hands and both toes.
#
# Blender Z-up world space, the character facing -Y, so +X is his left. Each
# row is a direction and not a unit vector, so the reader normalizes it. Left
# and right rows are exact reflections across X = 0, which is why every row is
# whole numbers.
#
# The arms sit 45 degrees below horizontal because the aim has to describe
# both rigs: measured against this table, our A-posed rig is worst at 34.86
# degrees (`right_hand`) and a T-posed Mixamo rig is worst at 45.01 (the
# arms), both inside `max_bind_deviation_degrees`. A T-pose table would put
# our hands at 76.15 and 78.22, outside it. Our `Hips` is 97.80 degrees out,
# which is the sideways hip axis the audit found, and `rig.aim_table` reports
# it until the rig is regenerated.
#
# Every figure for our own rig is asserted in `test_aim.rs` against the
# committed `humanoid.glb`. The Mixamo one is a HAND MEASUREMENT, read off
# `art/staging/downloads/strafe_left.fbx` in Blender 5.2.1: that directory is
# gitignored, so no test can open the file and CI cannot re-derive the number.
[aim_table]
hips = [0.0, 0.0, 1.0]
spine_lower = [0.0, 0.0, 1.0]
spine_middle = [0.0, 0.0, 1.0]
spine_upper = [0.0, 0.0, 1.0]
neck = [0.0, 0.0, 1.0]
head = [0.0, 0.0, 1.0]
left_shoulder = [1.0, 0.0, 0.0]
right_shoulder = [-1.0, 0.0, 0.0]
left_arm = [1.0, 0.0, -1.0]
right_arm = [-1.0, 0.0, -1.0]
left_forearm = [1.0, 0.0, -1.0]
right_forearm = [-1.0, 0.0, -1.0]
left_hand = [1.0, 0.0, -1.0]
right_hand = [-1.0, 0.0, -1.0]
left_upper_leg = [0.0, 0.0, -1.0]
right_upper_leg = [0.0, 0.0, -1.0]
left_leg = [0.0, 0.0, -1.0]
right_leg = [0.0, 0.0, -1.0]
left_foot = [0.0, -1.0, -1.0]
right_foot = [0.0, -1.0, -1.0]
left_toe = [0.0, -1.0, 0.0]
right_toe = [0.0, -1.0, 0.0]

# Every published rig limit, as data. `crates/xtask-art/src/check/rig.rs` is
# the only reader, and `cargo art check --list-rules` prints it.
#
# Bone names are the Mixamo and HumanIK standard, with the spine numbered from
# the bottom, so `Spine` is the lowest of the three. The committed rig was
# renamed to these, so the two convention tables below are now identical and
# `[fingerprints]` is what tells them apart.
[profile]
# The exact bone set. `head_end` and `headfront` fill no role, and they are
# listed because they are part of this rig.
bones = [
    "Hips",
    "Spine",
    "Spine1",
    "Spine2",
    "Neck",
    "Head",
    "head_end",
    "headfront",
    "LeftShoulder",
    "LeftArm",
    "LeftForeArm",
    "LeftHand",
    "LeftUpLeg",
    "LeftLeg",
    "LeftFoot",
    "LeftToeBase",
    "RightShoulder",
    "RightArm",
    "RightForeArm",
    "RightHand",
    "RightUpLeg",
    "RightLeg",
    "RightFoot",
    "RightToeBase",
]
# The ancestor of every other bone.
single_root = "Hips"
# Mesh objects a character file may hold. Read by the mesh gates, which run on
# the character rather than on this skeleton.
meshes = ["char1"]
# In Blender, after the glTF Y-up import.
up_axis = "z"
# In glTF Y-up, which is the space Meshy's rigger states its facing in. The
# same direction is minus Y in Blender, where the bake camera sits.
facing_axis_gltf = "+z"
# Which bone axis points from a joint to its child, and how far it may stray.
child_axis = "y"
child_axis_tolerance_degrees = 2.0
# Rig height against `spec.subject.height_meters`.
height_tolerance_percent = 5.0
# Left against right, on segment lengths and on segment directions.
mirror_tolerance_percent = 1.0
mirror_tolerance_degrees = 1.0
# How far the root chain may lean from the up axis. Wide on purpose: it catches
# a rig lying down, not an A-pose, because the bind pose stays an art choice.
max_bind_deviation_degrees = 75.0
# The upper arm, measured below the horizontal plane.
humerus_below_horizontal = { target = 40.0, tolerance = 15.0 }

# Every published concept limit. Read by
# `crates/xtask-art/src/check/concept.rs`, on the four committed views under
# `art/characters/survivor/concept/`, which are the only concept art this
# repository holds. Every number below is what those four read plus the
# headroom written beside it, and every negative reading is from the fixtures
# in `crates/xtask-art/tests/unit/concepts.rs`.
#
# `concept.single_figure` has no row: its limit is one figure, and a count of
# figures has nothing to tune.
[profile.concept]
# How uneven the fill behind the figure may be, in levels of 0 to 255. front
# and left read 3, back and right 6, so this sits 2x over the worst of them.
# The reading saturates near twice the 12 levels the silhouette is classified
# at, so it refuses any ramp wider than about 12 levels and cannot tell a
# large one from a larger: a 30 percent ramp added to front.png reads 24. It
# reads only the region the border fill reaches, and `concept.cross_view` is
# what catches a second backdrop tone the fill stopped at.
background_spread_levels = 12
# What share of the torso band's rows must show both arms clear of the body.
# front reads 86.054 percent and back 86.316, and the 14 percent that do not
# are the shoulder rows at the top of the band, where an A-posed arm still
# touches the ribcage. This sits 11 points under the worst of the two, and
# front with the gaps painted shut reads 0.000. A floor, not a ceiling: the
# only limit here that a reading must reach rather than stay under.
arm_gap_rows_percent = 75.0
# How far a view's silhouette may sit from its own reflection, as a percent of
# its width, at the 99th percentile of its rows. front reads 1.167 and back
# 1.062, so this sits 2x over the worst of them, and front with its left half
# stretched 15 percent reads 6.394. Neither the mean nor the outright worst
# row: the mean reads 0.301 against 1.260, less separation, and the worst row
# reads 4.669 against 6.522, which is hair against a stretched limb.
mirror_percent = 2.4
# How far two views may disagree about the figure's height or where its weight
# sits, as a percent of the mean of the two heights. The worst of the six
# pairs is front against back at 3.256 percent, so this sits 1.8x over it,
# and the left view at 92 percent of its size reads 10.549 against the front.
cross_view_percent = 6.0

# Every published mesh limit. Read by `crates/xtask-art/src/check/mesh.rs`.
#
# PROVISIONAL: the five calibrated values here are measured on the committed
# `art/characters/survivor/model.glb`, which is the file after rigging. The
# gates run on `art/staging/<char>/bare.glb`, the mesh before rigging, and no
# Meshy key on this machine could download it. **T10 downloads `bare.glb` and
# recalibrates these rows.**
#
# The one row measured after the fixer, `non_manifold_post`, is calibrated on a
# stand-in: the same mesh lifted out of `model.glb` unskinned, cleaned locally.
#
# Measured welded at 1e-5 m in world space, with the headroom each limit
# leaves. The plateau that chose 1e-5 is in the design document. The last two
# rows are not calibrations at all: one is Meshy's stated rigging limit and
# one is the edge count the design records for `print/analyze`.
[profile.mesh]
holes = 200                  # boundary edges. model.glb reads 171
non_manifold_edges = 10      # edges shared by 3+ faces. model.glb reads 8
islands = 8                  # connected pieces. model.glb reads 7
# The one row the fixer moves the wrong way: mirroring a mesh copies the
# crossings of the half it keeps, so the cleaned stand-in reads 1026 against
# this 1000 and **fails today**. Recalibrate it on the real pair, not on the
# bare mesh alone, or raise it with the headroom written down.
self_intersections = 1000    # faces that meet. model.glb reads 861
mirror_percent = 3.5         # of the width. model.glb reads 3.021
# Meshy's stated limit for rigging, not a calibration.
triangles = 300000           # model.glb reads 54,864
# Meshy's own count, which adds boundary and non-manifold edges together.
printability_edges = 200     # model.glb is recorded at 179
# After the fixer, which is its own ceiling: filling a hole closes it with a
# face that can meet two others, so this rises where `non_manifold_edges` is
# read before any of that. PROVISIONAL, on the stand-in described above, and
# wider than the 25 percent the row above leaves because the count it is set
# from was not read on `bare.glb` at all.
non_manifold_post = 20       # the stand-in's clean.glb reads 12, so 8 spare

# What the fixer runs on. Read by `crates/xtask-art/src/stages.rs`, which puts
# every one of them on Blender's argv, so no script holds a copy.
#
# Not ceilings: the fixer measures nothing. The weld distance is not here
# either, because `check/gltf_mesh.rs` already owns it and two copies of one
# distance drift apart.
[profile.cleanup]
# An island under this is debris the rigger would be paid to skin. About a
# 1 cm cube: `tools/blender/tests/unit/test_cleanup.py` measures one at
# exactly 1e-6.
smallest_island_cubic_meters = 1e-6
# How far a vertex may sit from its own reflection and still be mirrored onto
# it. 1 mm on a 1.7 m body.
symmetrize_meters = 0.001

# Every published clip limit. Read by `crates/xtask-art/src/check/clip.rs`.
#
# Both are calibrated, not assumed. The calibration asset is a synthetic
# cross-rig pair in `crates/xtask-art/tests/unit/clips.rs`: a second rig whose
# legs sit 174 degrees of pure roll from ours, exactly the difference fact 3
# measures against Mixamo, driven by a hand-built motion. On that pair both
# expected values are 0 and what the rules read is the `f32` the GLB stores.
#
# The real pair was measured by hand as well, in Blender 5.2.1, on the three
# Mixamo clips under `art/staging/downloads/`. That directory is gitignored, so
# no test can open those files and CI cannot re-derive these numbers.
[profile.clip]
# Worst per bone over the clip. The synthetic pair reads 4.3e-6 and the three
# Mixamo clips read 4.1e-5 to 7.1e-5, all of it `f32` storage rather than
# maths. The pre-rename shipped output reads 97.797 on the hips, so this limit
# clears the worst real reading by 142x and sits 9,780x under the defect it
# exists to catch.
swing_degrees = 0.01
# Worst per bone over the clip. The synthetic pair reads 3.5e-6, because two
# rigs whose bones differ by a roll agree exactly and only the file rounds. The
# three Mixamo clips read 11.411, which is not a defect: our A-pose forearm
# rests 62.5 degrees from Mixamo's T-posed one, and aiming both at one table
# gives that swing a roll of its own. 15.0 leaves 3.589 degrees, 31 percent,
# over the worst real reading. T15 regenerates the rig closer to the 40 degree
# target and can retighten it.
twist_degrees = 15.0
# How far a key may sit off a whole frame of the clip's own `source_fps`. The
# three committed clips read under 1e-6 frames, worst 9.5e-7, which is the
# `f32` a GLB stores key times in. Read on another rate's grid the same clips
# read 0.5, so this sits 5,000x under the defect it exists to catch.
fps_grid_frames = 1e-4
# How far the root may still drift on either horizontal axis after the bake
# strips its horizontal motion. The three committed clips read about 2
# nanometers, which is the `f32` an F-curve stores; the shipped `strafe_left`
# output reads 0.0428 m on X under the strip this replaces.
root_travel_meters = 0.02
# How far the root may move on the up axis, which the strip keeps on purpose
# because a bob is animation. Measured on the four fitted clips: 0.0089
# (idle), 0.0377 (strafe_left), 0.0391 (walk_back) and 0.0535 (run). This sits
# 2.8x over the worst of those and still rejects the 0.2911 m that pinning the
# root's own channels 0 and 1 sinks a left strafe by.
root_bob_meters = 0.15
# How far the lowest ground joint may sit from the rest height the snap puts
# it at. Read at two sites on the three Mixamo fits: the retarget's own pose
# gives 9.3e-9 to 4.3e-8 m and the delivered GLB 3.9e-8 to 6.7e-7 m, all of it
# `f32` storage rather than a real gap. This sits 7,493x over the worst of
# them and still rejects the 0.0599 m the same fit leaves with the lift
# removed. The committed `run.glb` reads 0.0017 m.
floor_snap_meters = 0.005
# How far a fitted clip's travel may sit from the source's travel sized by the
# femur ratio, as a percent of that expected travel. The same three fits read
# 4.6e-6 to 2.4e-5 percent across both sites, so this sits 81,865x over the
# worst of them, and a fit sized five percent out reads 5.0. `strafe_left`
# travels 2.3117 m on the vendor rig and our femur is 0.8815 of theirs, so
# 2.0378 m is what the fit has to reproduce.
stride_percent = 2.0
# How far a looping clip's last pose may sit from its first, per bone. `run`
# reads 0.000 degrees and `idle` 0.487. `walk_back` reads 6.910 on nine of its
# bones, which is the hitch `art/animations/library.ron` has recorded in prose
# all along and which nothing could measure until now.
loop_degrees = 2.0
# How often each foot must come to rest on the ground over one cycle. A clip
# the library declares in place has a ground that moves under it, so its feet
# must slide and both stance rules report themselves switched off.
foot_plants = 1
# How far a planted foot may slide while it is down. With the lock in, the
# three Mixamo fits read exactly 0.0000 m; with it removed the same fits read
# 0.0207 (strafe_left), 0.0148 (walk_back) and 0.0027 m (strafe_right).
foot_skate_meters = 0.025
# How far the lowest point of a sole may go under the ground plane at zero.
# The vendor's own `strafe_left.fbx` reads 0.0000 m at every planted frame and
# 0.0038 at worst, and a refit of `run.glb` onto its own rig clears the floor
# by 0.0074 and 0.0005 m. The three cross-rig Mixamo fits read 0.0200 to
# 0.0203 m, which is what correction 4 of T9 records.
foot_penetration_meters = 0.005

# Every published source limit, read at fetch time before a clip is fitted to
# anything. `crates/xtask-art/src/check/source.rs` publishes them and
# `tools/blender/src/check_source.py` measures them.
[profile.source]
# The line `travels` in `art/animations/library.ron` draws, read on the hips
# from the vendor file's first frame to its last, horizontally. `strafe_left.fbx`
# measures 2.3117 m and the committed `run.glb` measures 0.0000, so this sits
# two orders from either side of the question it decides. How far the hips
# wander on the way is `source.wander`, which records rather than gates and
# therefore reads against a ceiling in `check/source.rs` instead.
travel_meters = 0.02

# The real hierarchy. Read by `rig.parents` and `rig.single_root`.
[profile.parents]
Spine = "Hips"
Spine1 = "Spine"
Spine2 = "Spine1"
Neck = "Spine2"
Head = "Neck"
head_end = "Head"
headfront = "Head"
LeftShoulder = "Spine2"
LeftArm = "LeftShoulder"
LeftForeArm = "LeftArm"
LeftHand = "LeftForeArm"
LeftUpLeg = "Hips"
LeftLeg = "LeftUpLeg"
LeftFoot = "LeftLeg"
LeftToeBase = "LeftFoot"
RightShoulder = "Spine2"
RightArm = "RightShoulder"
RightForeArm = "RightArm"
RightHand = "RightForeArm"
RightUpLeg = "Hips"
RightLeg = "RightUpLeg"
RightFoot = "RightLeg"
RightToeBase = "RightFoot"

# The child each bone's `child_axis` must point at, the way Godot's
# `SkeletonProfile` carries a tail beside every parent. A branch bone needs it:
# `Hips` has three children and only one of them continues the body. Every row
# here must also be a row of `[profile.parents]`, the other way around.
[profile.tails]
Hips = "Spine"
Spine = "Spine1"
Spine1 = "Spine2"
Spine2 = "Neck"
Neck = "Head"
Head = "head_end"
LeftShoulder = "LeftArm"
LeftArm = "LeftForeArm"
LeftForeArm = "LeftHand"
LeftUpLeg = "LeftLeg"
LeftLeg = "LeftFoot"
LeftFoot = "LeftToeBase"
RightShoulder = "RightArm"
RightArm = "RightForeArm"
RightForeArm = "RightHand"
RightUpLeg = "RightLeg"
RightLeg = "RightFoot"
RightFoot = "RightToeBase"
