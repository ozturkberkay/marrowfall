# Which bone fills each body part, per vendor naming. Retargeting matches by
# role, never by name, because vendors number their spines differently.

canonical = "standard"

# Roles a source rig may leave out. None so far.
optional_roles = []

# Step length is sized by the thigh, not by total height.
stride_segment = ["left_upper_leg", "left_leg"]

# The feet. Every clip is lifted until the lowest sole point touches zero.
ground_roles = ["left_toe", "right_toe"]

# Meshy's names. Its spine is numbered from the top.
[conventions.meshy]
hips = "Hips"
spine_lower = "Spine02"
spine_middle = "Spine01"
spine_upper = "Spine"
neck = "neck"
head = "Head"
left_shoulder = "LeftShoulder"
left_arm = "LeftArm"
left_forearm = "LeftForeArm"
left_hand = "LeftHand"
left_upper_leg = "LeftUpLeg"
left_leg = "LeftLeg"
left_foot = "LeftFoot"
left_toe = "LeftToeBase"
right_shoulder = "RightShoulder"
right_arm = "RightArm"
right_forearm = "RightForeArm"
right_hand = "RightHand"
right_upper_leg = "RightUpLeg"
right_leg = "RightLeg"
right_foot = "RightFoot"
right_toe = "RightToeBase"

# Ours: the Mixamo/HumanIK standard, spine numbered from the bottom.
[conventions.standard]
hips = "Hips"
spine_lower = "Spine"
spine_middle = "Spine1"
spine_upper = "Spine2"
neck = "Neck"
head = "Head"
left_shoulder = "LeftShoulder"
left_arm = "LeftArm"
left_forearm = "LeftForeArm"
left_hand = "LeftHand"
left_upper_leg = "LeftUpLeg"
left_leg = "LeftLeg"
left_foot = "LeftFoot"
left_toe = "LeftToeBase"
right_shoulder = "RightShoulder"
right_arm = "RightArm"
right_forearm = "RightForeArm"
right_hand = "RightHand"
right_upper_leg = "RightUpLeg"
right_leg = "RightLeg"
right_foot = "RightFoot"
right_toe = "RightToeBase"

# Mixamo's names: ours under a namespace the comparison strips.
[conventions.mixamo]
hips = "Hips"
spine_lower = "Spine"
spine_middle = "Spine1"
spine_upper = "Spine2"
neck = "Neck"
head = "Head"
left_shoulder = "LeftShoulder"
left_arm = "LeftArm"
left_forearm = "LeftForeArm"
left_hand = "LeftHand"
left_upper_leg = "LeftUpLeg"
left_leg = "LeftLeg"
left_foot = "LeftFoot"
left_toe = "LeftToeBase"
right_shoulder = "RightShoulder"
right_arm = "RightArm"
right_forearm = "RightForeArm"
right_hand = "RightHand"
right_upper_leg = "RightUpLeg"
right_leg = "RightLeg"
right_foot = "RightFoot"
right_toe = "RightToeBase"

# Joints that fill no role, named per convention. The retarget drives a role.
# A landmark is only measured: `skull_top` is the tip of the head, and the
# posture readings take it against the `head` joint below it.
[landmarks.meshy]
skull_top = "head_end"

[landmarks.standard]
skull_top = "head_end"

[landmarks.mixamo]
skull_top = "HeadTop_End"

# The order the retarget walks, by role. Keyed by role and not by bone, so a
# source with fewer spine bones still drives ours. `hips` is the top.
[retarget_chain]
spine_lower = "hips"
spine_middle = "spine_lower"
spine_upper = "spine_middle"
neck = "spine_upper"
head = "neck"
left_shoulder = "spine_upper"
left_arm = "left_shoulder"
left_forearm = "left_arm"
left_hand = "left_forearm"
left_upper_leg = "hips"
left_leg = "left_upper_leg"
left_foot = "left_leg"
left_toe = "left_foot"
right_shoulder = "spine_upper"
right_arm = "right_shoulder"
right_forearm = "right_arm"
right_hand = "right_forearm"
right_upper_leg = "hips"
right_leg = "right_upper_leg"
right_foot = "right_leg"
right_toe = "right_foot"

# How we tell whose rig a file is. All bones in a row must be present.
[fingerprints]
meshy = ["Spine02"]
standard = ["Spine1", "headfront"]
mixamo = ["HeadTop_End"]

# The shared pose both rigs are aimed at before the retarget measures the
# offset between them. One row per role, torso included.
#
# Blender Z-up, facing -Y, so +X is his left. Directions, not unit vectors.
# Arms sit halfway between an A-pose and a T-pose so the table fits both.
[aim_table]
hips = [0.0, 0.0, 1.0]
spine_lower = [0.0, 0.0, 1.0]
spine_middle = [0.0, 0.0, 1.0]
spine_upper = [0.0, 0.0, 1.0]
neck = [0.0, 0.0, 1.0]
head = [0.0, 0.0, 1.0]
left_shoulder = [1.0, 0.0, 0.0]
right_shoulder = [-1.0, 0.0, 0.0]
left_arm = [1.0, 0.0, -1.0]
right_arm = [-1.0, 0.0, -1.0]
left_forearm = [1.0, 0.0, -1.0]
right_forearm = [-1.0, 0.0, -1.0]
left_hand = [1.0, 0.0, -1.0]
right_hand = [-1.0, 0.0, -1.0]
left_upper_leg = [0.0, 0.0, -1.0]
right_upper_leg = [0.0, 0.0, -1.0]
left_leg = [0.0, 0.0, -1.0]
right_leg = [0.0, 0.0, -1.0]
left_foot = [0.0, -1.0, -1.0]
right_foot = [0.0, -1.0, -1.0]
left_toe = [0.0, -1.0, 0.0]
right_toe = [0.0, -1.0, 0.0]

# Every rig limit, as data. `cargo art check --list-rules` prints them all.
[profile]
# The exact bone set. `head_end` and `headfront` fill no role.
bones = [
    "Hips",
    "Spine",
    "Spine1",
    "Spine2",
    "Neck",
    "Head",
    "head_end",
    "headfront",
    "LeftShoulder",
    "LeftArm",
    "LeftForeArm",
    "LeftHand",
    "LeftUpLeg",
    "LeftLeg",
    "LeftFoot",
    "LeftToeBase",
    "RightShoulder",
    "RightArm",
    "RightForeArm",
    "RightHand",
    "RightUpLeg",
    "RightLeg",
    "RightFoot",
    "RightToeBase",
]
# The ancestor of every other bone.
single_root = "Hips"
# One mesh, three names: unnamed out of Meshy, `Mesh_0` out of Blender,
# `char1` out of the rigger. Anything else is a stray object.
meshes = ["node 0", "Mesh_0", "char1"]
# In Blender, after the glTF Y-up import.
up_axis = "z"
# In glTF Y-up. The same direction is -Y in Blender.
facing_axis_gltf = "+z"
# Which bone axis points from a joint to its child, and how far it may stray.
child_axis = "y"
child_axis_tolerance_degrees = 2.0
# Rig height against `spec.subject.height_meters`.
height_tolerance_percent = 5.0
# Left against right, on segment lengths and on segment directions.
mirror_tolerance_percent = 1.0
mirror_tolerance_degrees = 1.0
# How far the spine may lean. Wide: it catches a rig lying down, not a pose.
max_bind_deviation_degrees = 75.0
# How far the upper arm hangs below horizontal. Tolerance is wide because
# Meshy always returns arms about 19 degrees off what the prompt asks for.
humerus_below_horizontal = { target = 40.0, tolerance = 25.0 }

# Concept-art limits, calibrated on the four committed views.
[profile.concept]
# How uneven the backdrop may be, 0 to 255. Real views read 3 to 6.
background_spread_levels = 12
# Share of torso rows where both arms are clear of the body. A floor, not a
# ceiling. Real views read 86 percent.
arm_gap_rows_percent = 75.0
# How lopsided a view may be, percent of its width. Real views read ~1.1.
mirror_percent = 2.4
# How far two views may disagree on height or balance. Worst real pair 3.3.
cross_view_percent = 6.0

# Mesh limits, calibrated on a real Meshy mesh. Readings are beside each row.
[profile.mesh]
holes = 200                  # boundary edges. bare.glb reads 31, clean.glb 18
non_manifold_edges = 10      # edges shared by 3+ faces. bare.glb reads 6
islands = 8                  # connected pieces. bare.glb reads 4, clean.glb 1
# Rises through cleanup: mirroring copies the crossings of the half it keeps.
self_intersections = 1500    # faces that meet. bare.glb 1094, clean.glb 1153
mirror_percent = 3.5         # of the width. bare.glb reads 3.257, model.glb 3.021
# Meshy's stated rigging limit, not a calibration.
triangles = 300000           # bare.glb reads 54,909 and clean.glb 55,553
# Meshy's own count: boundary plus non-manifold edges.
printability_edges = 200     # model.glb is recorded at 179
# After cleanup. Filling a hole can create a new non-manifold edge.
non_manifold_post = 20       # clean.glb reads 17, so 3 spare
# Height against the spec. Wide, because nothing scales the mesh until the
# rigging call: Meshy returns it about 11 percent tall.
height_percent = 25.0        # bare.glb reads 11.588 and clean.glb 11.435

# Settings the mesh fixer runs on. Not limits: the fixer measures nothing.
[profile.cleanup]
# Smaller than this is debris to delete. About a 1 cm cube.
smallest_island_cubic_meters = 1e-6
# How far a vertex may sit from its mirror and still be snapped onto it.
symmetrize_meters = 0.001

# Limits on the rendered sprite frames, measured on all 1,472 of them.
[profile.bake]
# How little of the canvas a frame may cover. Catches a frame that rendered
# nothing. Real frames read 4.4 percent and up.
frame_coverage_percent = 1.0
# Catches a pose the camera cut off. Real frames stay 60+ px clear.
in_frame_pixels = 1.0
# Opposite directions must mirror about the canvas center. Catches a camera
# that drifted off the turntable axis.
pivot_pixels = 2.0
# How far a joint may move from where `art/goldens/` says it landed last time.
# One pixel: enough for rounding, not enough to hide a changed pose.
landmark_pixels = 1.0

# Limits on a fitted animation clip.
[profile.clip]
# How far a fitted bone may point away from the source's. Real fits read 1.5e-3.
swing_degrees = 0.01
# How far a fitted bone may be twisted about its own length from the source's.
# Real fits read 8.9, because our A-pose forearm rests far from a T-posed one.
twist_degrees = 15.0
# Keys must land on whole frames of the clip's own rate. Catches a wrong rate.
fps_grid_frames = 1e-4
# Leftover sideways drift after the bake pins the character in place.
root_travel_meters = 0.02
# How much the body may bob up and down. Kept on purpose: a bob is animation.
root_bob_meters = 0.15
# How far the lowest sole may float above the floor.
floor_snap_meters = 0.005
# The fit must cover the source's distance, scaled by the thigh-length ratio.
# A shorter character takes a proportionally shorter step.
stride_percent = 2.0
# How far a fitted joint may sit from where the source put it. The only rule
# that reads the whole body at once, so it is what catches a hunch.
posture_meters = 0.12
# A loop's last pose must match its first, or the animation hitches.
loop_degrees = 2.0
# Each foot must plant this many times a cycle. Off for in-place clips.
foot_plants = 1
# How far a planted foot may slide. This is the ice-skating check.
foot_skate_meters = 0.025
# How far a foot may sink through the floor.
foot_penetration_meters = 0.005

# Limits on a vendor clip as bought, before anything is fitted to it.
[profile.source]
# The line between "travels" and "runs in place" in `library.ron`.
travel_meters = 0.02

# The real hierarchy. Read by `rig.parents` and `rig.single_root`.
[profile.parents]
Spine = "Hips"
Spine1 = "Spine"
Spine2 = "Spine1"
Neck = "Spine2"
Head = "Neck"
head_end = "Head"
headfront = "Head"
LeftShoulder = "Spine2"
LeftArm = "LeftShoulder"
LeftForeArm = "LeftArm"
LeftHand = "LeftForeArm"
LeftUpLeg = "Hips"
LeftLeg = "LeftUpLeg"
LeftFoot = "LeftLeg"
LeftToeBase = "LeftFoot"
RightShoulder = "Spine2"
RightArm = "RightShoulder"
RightForeArm = "RightArm"
RightHand = "RightForeArm"
RightUpLeg = "Hips"
RightLeg = "RightUpLeg"
RightFoot = "RightLeg"
RightToeBase = "RightFoot"

# Which child each bone must point at. Needed where a bone branches: `Hips`
# has three children and only `Spine` continues the body.
[profile.tails]
Hips = "Spine"
Spine = "Spine1"
Spine1 = "Spine2"
Spine2 = "Neck"
Neck = "Head"
Head = "head_end"
LeftShoulder = "LeftArm"
LeftArm = "LeftForeArm"
LeftForeArm = "LeftHand"
LeftUpLeg = "LeftLeg"
LeftLeg = "LeftFoot"
LeftFoot = "LeftToeBase"
RightShoulder = "RightArm"
RightArm = "RightForeArm"
RightForeArm = "RightHand"
RightUpLeg = "RightLeg"
RightLeg = "RightFoot"
RightFoot = "RightToeBase"
