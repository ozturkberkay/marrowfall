; Export presets. The one setting here that matters today is `include_filter`.
;
; Godot exports resources automatically and skips everything else, so the tuning
; tables and the sprite manifest would be missing from a build and the game would
; refuse to start. Every preset added later must carry the same filter.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.tsv,*.ron"
exclude_filter=""
export_path="../build/linux/marrowfall.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
